<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Logger Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #bb86fc;
            --text-main: #e0e0e0;
            --text-sec: #a0a0a0;
            --border: #333;
            --danger: #cf6679;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--card-bg);
            width: 500px;
            height: 85vh;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
        }

        .header-title {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 1.1rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-sec);
            margin-top: 2px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .countdown {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent);
            background: rgba(187, 134, 252, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .download-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .download-btn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .download-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .input-area {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
        }

        input {
            background: #2c2c2c;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--accent);
        }

        input[type="time"] {
            width: 110px;
            cursor: pointer;
        }

        input[type="text"] {
            flex-grow: 1;
        }

        button#addBtn {
            background: var(--accent);
            color: black;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button#addBtn:active {
            transform: scale(0.95);
        }

        .log-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0 20px 20px 20px;
        }

        .log-container::-webkit-scrollbar {
            width: 6px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background-color: #444;
            border-radius: 3px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .time-display {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-size: 0.9rem;
            margin-right: 15px;
            min-width: 60px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .time-display:hover {
            background: rgba(187, 134, 252, 0.1);
        }

        .text-display {
            flex-grow: 1;
            cursor: text;
            padding: 2px 4px;
            border-radius: 4px;
            outline: none;
            line-height: 1.4;
        }

        .text-display:focus {
            background: rgba(255,255,255,0.05);
        }

        .delete-btn {
            opacity: 0;
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.2rem;
            transition: opacity 0.2s;
            padding: 0 0 0 10px;
        }

        li:hover .delete-btn {
            opacity: 1;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>Daily Log</h1>
                <span class="subtitle" id="currentDate">Loading...</span>
            </div>
            <div class="controls">
                <span id="countdown" class="countdown" title="Time until auto-save">--:--:--</span>
                <button id="manualDownloadBtn" class="download-btn" title="Download Report Now">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                </button>
            </div>
        </header>
        
        <div class="input-area">
            <input type="time" id="timeInput">
            <input type="text" id="taskInput" placeholder="What are you working on?">
            <button id="addBtn">LOG</button>
        </div>

        <div class="log-container">
            <ul id="logList"></ul>
        </div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const timeInput = document.getElementById('timeInput');
        const addBtn = document.getElementById('addBtn');
        const logList = document.getElementById('logList');
        const countdownEl = document.getElementById('countdown');
        const manualDownloadBtn = document.getElementById('manualDownloadBtn');
        const currentDateEl = document.getElementById('currentDate');
        
        let logs = JSON.parse(localStorage.getItem('dailyLogs')) || [];
        let reportGenerated = false;
        let isManualTime = false;

        function updateClock() {
            const now = new Date();
            if (!isManualTime) {
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                timeInput.value = `${hours}:${minutes}`;
            }
            currentDateEl.textContent = now.toDateString();
        }

        function updateCountdown() {
            const now = new Date();
            const target = new Date(now);
            target.setHours(23, 59, 59, 999);
            
            const diff = target - now;
            
            if (diff < 0) {
                countdownEl.textContent = "00:00:00";
                return;
            }

            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            countdownEl.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function saveLogs() {
            localStorage.setItem('dailyLogs', JSON.stringify(logs));
        }

        function renderLogs() {
            logList.innerHTML = '';
            logs.forEach((log, index) => {
                const li = document.createElement('li');
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'time-display';
                timeSpan.textContent = log.time;
                timeSpan.contentEditable = true;
                timeSpan.onblur = function() {
                    logs[index].time = this.textContent;
                    saveLogs();
                };
                
                const textSpan = document.createElement('span');
                textSpan.className = 'text-display';
                textSpan.textContent = log.text;
                textSpan.contentEditable = true;
                textSpan.onblur = function() {
                    logs[index].text = this.textContent;
                    saveLogs();
                };

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '&times;';
                delBtn.onclick = function() {
                    logs.splice(index, 1);
                    saveLogs();
                    renderLogs();
                };

                li.appendChild(timeSpan);
                li.appendChild(textSpan);
                li.appendChild(delBtn);
                logList.appendChild(li);
            });
            
            const container = document.querySelector('.log-container');
            container.scrollTop = container.scrollHeight;
        }

        function addLog() {
            const text = taskInput.value.trim();
            const time = timeInput.value;
            
            if (!text || !time) return;

            logs.push({ time, text });
            saveLogs();
            
            taskInput.value = '';
            isManualTime = false;
            updateClock();
            renderLogs();
        }

        function generateAndDownload(isAuto) {
            if (logs.length === 0) return;

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            
            logs.sort((a, b) => a.time.localeCompare(b.time));

            let content = `DAILY REPORT | ${dateStr}\n`;
            content += `Generated at: ${now.toLocaleTimeString()}\n`;
            content += `Type: ${isAuto ? 'Auto-Scheduled' : 'Manual Export'}\n`;
            content += `----------------------------------------\n\n`;
            
            logs.forEach(log => {
                content += `[${log.time}] ${log.text}\n`;
            });

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `DailyReport_${dateStr}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            if (isAuto) {
                logs = [];
                saveLogs();
                renderLogs();
            }
        }

        function monitorTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            if (!isManualTime && seconds === 0) {
                updateClock();
            }
            
            updateCountdown();

            if (hours === 23 && minutes === 59 && seconds === 0) {
                if (!reportGenerated) {
                    generateAndDownload(true);
                    reportGenerated = true;
                }
            } else if (hours === 0 && minutes === 0) {
                reportGenerated = false;
            }
        }

        timeInput.addEventListener('focus', () => isManualTime = true);
        timeInput.addEventListener('blur', () => {
            if(!timeInput.value) {
                isManualTime = false;
                updateClock();
            }
        });

        addBtn.addEventListener('click', addLog);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addLog();
        });
        
        manualDownloadBtn.addEventListener('click', () => generateAndDownload(false));

        updateClock();
        renderLogs();
        setInterval(monitorTime, 1000);
        updateCountdown();
    </script>
</body>
</html>
